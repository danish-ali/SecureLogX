securelogx.enableMasking=true
securelogx.modelPath=onnx-model/ml-v1.3/bert-base-cased/model.onnx
securelogx.tokenizerPath=onnx-model/ml-v1.3/bert-base-cased/tokenizer.json
securelogx.model.sha256=5953acd999083fa08c17c537e1d88c38f3c7137bc518022d8f3246c1133997c2
securelogx.tokenizer.sha256=b30eb8ca04d00e5330bade5d5e6036bd0ce0ad68f7b96e2e38bff11942ee30b1
securelogx.model.maxSequenceLength=384
# Bound native ONNX activation/tensor memory after long-record window expansion.
securelogx.model.maxInferenceWindowsPerBatch=4
# Production-candidate decoder; default code fallback remains ARGMAX_LEGACY.
securelogx.model.decoder=BIO_VITERBI_SAFETY_SUPPLEMENT

# Bounded production masking runtime (pilot defaults; tune only after load tests).
# One active masking worker is intentional to preserve the validated CPU/native
# memory envelope. Queue wait + tokenization + ONNX share this one deadline.
securelogx.runtime.maskingQueueCapacity=64
securelogx.runtime.maskingDeadlineMillis=2000
securelogx.runtime.shutdownWaitMillis=5000


#If true, enable multithreaded tokenization (PureJavaTokenizer) and ONNX CPU threading
securelogx.cpu.multithreading.enabled=true
#If true, prefer CUDA GPU for ONNX inference
securelogx.gpu.inference.enabled=false



#CPU_SINGLE, CPU_MULTI, GPU, KAFKA
securelogx.mode=CPU_MULTI


# Increase thread count for CPU mode
securelogx.maxCpuThreads=4

# Optimized GPU settings
securelogx.gpu.batch.size=64
securelogx.gpu.warmup.enabled=true
securelogx.gpu.max.threads=4
securelogx.gpu.max.sequence.length=1024
securelogx.gpu.memory.pool.enabled=true

securelogx.kafka=false
securelogx.logFile=logs/securelogx.log
securelogx.environment=dev


# Kafka settings
kafka.bootstrap.servers=localhost:9092
kafka.topic=securelog.masking.input
kafka.group.id=securelogx-group
kafka.acks=all
kafka.compression.type=lz4
kafka.security.protocol=PLAINTEXT

securelogx.kafka.bootstrap.servers=localhost:9092
securelogx.kafka.group.id=securelogx-masking-group
securelogx.kafka.topic=raw-logs
securelogx.log.file=logs/securelogx.log
securelogx.kafka.consumer.enabled=true

# Processor (Compile-Time) Settings
processor.enableNer=false

# Optimized GPU settings
securelogx.gpu.batch.size=64
securelogx.gpu.warmup.enabled=true
securelogx.gpu.max.threads=1
securelogx.gpu.max.sequence.length=1024
securelogx.gpu.memory.pool.enabled=true

securelogx.kafka=false
securelogx.logFile=logs/securelogx.log
securelogx.environment=dev
securelogx.masking.onlyIn=dev
securelogx.showLastFour=true
